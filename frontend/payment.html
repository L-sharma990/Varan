<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway Mock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-10 max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Seat Acceptance Fee</h2>
            <p class="text-gray-500 text-sm mt-1">Simulated ₹1 Payment</p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-8 flex justify-between items-center text-lg">
            <span class="text-gray-600 font-medium">Total Amount</span>
            <span class="font-bold text-gray-900">₹ 1.00</span>
        </div>

        <button onclick="processPayment()" id="pay-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-200">
            Pay Securely
        </button>

        <p class="text-xs text-center text-gray-400 mt-6 mt-4">This is a mock transaction intended for test purposes only.</p>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if(!user) window.location.href = 'index.html';

        async function processPayment() {
            const btn = document.getElementById('pay-btn');
            btn.innerHTML = 'Processing...';
            btn.disabled = true;
            btn.classList.add('opacity-75');

            setTimeout(async () => {
                try {
                    const res = await fetch('https://666185d8052341.lhr.life/api/payment', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ user_id: user.id })
                    });
                    if(res.ok) {
                        alert("Payment Successful!");
                        window.location.href = 'dashboard.html';
                    } else {
                        alert("Error processing payment.");
                        btn.innerHTML = 'Pay Securely';
                        btn.disabled = false;
                        btn.classList.remove('opacity-75');
                    }
                } catch(e) {
                    alert("Network Error.");
                }
            }, 1000);
        }
    </script>
</body>
</html>
