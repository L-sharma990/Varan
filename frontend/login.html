<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARAN | Login</title>
    <link rel="stylesheet" href="tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background-color:#000000;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:32px 32px;color:#fafafa;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        .font-space{font-family:'Space Grotesk',sans-serif}
        .card{background:#111113;border:1px solid #1c1c1f;border-radius:16px;transition:all .4s ease}
        .inp{width:100%;padding:10px 14px;background:#18181b;border:1px solid #27272a;border-radius:10px;color:#fff;font-size:13px;transition:all .3s}
        .inp:focus{outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.1)}
        .btn-primary{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#000;font-weight:700;padding:12px 28px;border-radius:12px;border:none;cursor:pointer;transition:all .3s;font-size:14px}
        .btn-primary:hover{box-shadow:0 0 30px rgba(20,184,166,.4);transform:translateY(-1px)}
        .fade-in{opacity:0;transform:translateY(24px);transition:all .7s cubic-bezier(.16,1,.3,1)}
        .fade-in.show{opacity:1;transform:translateY(0)}
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">
    <div class="absolute top-0 w-full z-50 px-6 py-4">
        <a href="#" class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-teal-400 to-emerald-600 flex items-center justify-center pulse-glow"><span class="text-black font-black text-lg">V</span></div>
            <div class="leading-tight"><div class="text-white font-bold text-lg tracking-tight font-space">VARAN</div><div class="text-[9px] text-teal-500 font-semibold tracking-[.2em]">वरण · SELECTION</div></div>
        </a>
    </div>

    <div class="w-full max-w-md px-6 z-10 fade-in">
        <div class="card p-10">
            <div id="error-message" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-sm"></div>
            <h3 class="text-2xl font-bold text-white mb-1 font-space">Welcome Back</h3>
            <p class="text-zinc-500 text-sm mb-8">Enter credentials to continue.</p>
            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div><label class="block text-xs font-bold text-zinc-500 mb-1.5">ROLL NUMBER</label><input type="text" id="login-rollno" required class="inp" placeholder="e.g. 202601"></div>
                <div class="relative">
                    <label class="block text-xs font-bold text-zinc-500 mb-1.5">PASSWORD</label>
                    <input type="password" id="login-password" required class="inp pr-10" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-3 top-[32px] text-teal-400 hover:text-teal-300 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <button type="submit" class="btn-primary w-full mt-2 py-3 text-base">Log In</button>
            </form>
            <p class="mt-6 text-sm text-zinc-500 text-center">New here? <a href="register.html" class="text-teal-400 font-semibold hover:text-teal-300">Register</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>

        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('.eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function checkAuth(){const u=JSON.parse(localStorage.getItem('user'));if(u){u.role==='admin'?window.location.href='admin.html':window.location.href='dashboard.html'}}
        checkAuth();
        function showMessage(m){const e=document.getElementById('error-message');e.textContent=m;e.classList.remove('hidden')}
        async function handleLogin(e){e.preventDefault();const rollno=document.getElementById('login-rollno').value,password=document.getElementById('login-password').value;try{const r=await fetch(`${API_BASE}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rollno,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');localStorage.setItem('user',JSON.stringify(d.user));d.user.role==='admin'?window.location.href='admin.html':window.location.href='dashboard.html'}catch(err){showMessage(err.message)}}
        document.addEventListener('DOMContentLoaded',()=>{const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')})},{threshold:.1});document.querySelectorAll('.fade-in').forEach(el=>obs.observe(el))});
</script>
</body>
</html>
